<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xtrud Studio - Logo Temporária</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: transparent;
    }
    .logo {
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
    }
    .logo-xtrud {
      font-size: 36px;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .logo-studio {
      font-size: 24px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="logo">
    <div class="logo-xtrud">XTRUD</div>
    <div class="logo-studio">STUDIO</div>
  </div>
</body>
</html>
